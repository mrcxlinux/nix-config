[backdrop]
enabled = true

[bar.default]
background_opacity = 0.87999998033046722
capsule = true
capsule_opacity = 0.8399999812245369
center = [ "clock", "weather" ]
end = [
    "cat",
    "keyboard_layout",
    "sysmon",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "notifications",
    "control-center"
]
margin_edge = 8
margin_ends = 19
scale = 1.1000000089406967
start = [ "launcher", "taskbar", "audio_visualizer" ]
thickness = 39

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
media = false

[plugins]
enabled = [ "noctalia/bongocat", "dotnetrob/cat" ]

[shell]
avatar_path = "/home/rares/Downloads/f22b558aa71f4fcedd9ce247218f1039.jpg"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    show_cursor = true

    [shell.session]
    grid = true
    grid_columns = 5
    show_shortcuts = false

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

[templates.nvim-base16]
input_path = "~/.config/nvim/lua/matugen-template.lua"
output_path = "~/.config/nvim/lua/matugen.lua"
post_hook = "pkill -SIGUSR1 nvim"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "zen-browser", "neovim", "vscode", "fastfetch" ]

[wallpaper.default]
path = "/home/rares/Pictures/Wallpapers/catpuccin.jpg"

[wallpaper.last]
path = "/home/rares/Pictures/Wallpapers/catpuccin.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/rares/Pictures/Wallpapers/catpuccin.jpg"

[widget.audio_visualizer]
centered = false

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.cat]
capsule = true
capsule_opacity = 0.0
input_devices = [ "/dev/input/event0" ]
type = "noctalia/bongocat:cat"

[widget.clock]
capsule = true
capsule_opacity = 0.0
format = "{:%H:%M %d.%m.%Y}"
scale = 1.2

[widget.keyboard_layout]
scale = 0.94999999999999996

[widget.launcher]
capsule = true
capsule_opacity = 0.0
capsule_padding = 5
custom_image = "/home/rares/Downloads/nix-snowflake-colours.svg"
scale = 1.3500000000000001

[widget.network]
show_label = false

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
icon_scale = 1.05

    [widget.taskbar.actions]
    scroll_down = "taskbar-cycle prev"
    scroll_up = "taskbar-cycle next"

[widget.volume]
show_label = false

[widget.weather]
capsule = true
capsule_opacity = 0.0
capsule_padding = 0
scale = 1.05
show_condition = false

[widget.workspaces]
capsule = true
capsule_opacity = 0.0
style = "focus_hint"
